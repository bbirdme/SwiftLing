name: Idea or feature request
description: Something SwiftLing could do
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like
      description: The problem first, then what you imagine.
    validations:
      required: true
  - type: textarea
    id: plugin
    attributes:
      label: A plugin or theme that does not translate yet?
      description: Its name, and what stays untranslated.
